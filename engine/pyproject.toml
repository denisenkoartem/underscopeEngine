[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "underscope"
version = "0.1.0"
description = "Routing engine for damaged vehicles: ACV or Copart, from the reader's assessment"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "numpy", "pyyaml", "typer", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
underscope = "underscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
