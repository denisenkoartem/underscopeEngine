# Every number below is a PLACEHOLDER. None is a real market figure.
# Money is integer cents. Ranges are [low, expected, high].
# Each section says what real data would replace it.

meta:
  status: PLACEHOLDER
  note: Synthetic development values only; do not quote as market data.

base_value:
  status: PLACEHOLDER
  replace_with: Clean wholesale value per VIN/trim/mileage/region from ACV market data (or VehicleRecord.clean_value_cents).
  reference_year: 2026
  new_value_cents: 3000000
  depreciation_pct_per_year: 9
  cents_per_mile: 4
  floor_cents: 150000

defaults:
  status: PLACEHOLDER
  replace_with: A VIN decode for the model year, the odometer reading, and the state the vehicle is in.
  # Used only when the description does not give the fact; the response notes each one used.
  vehicle_age_years: 8     # year unknown: assumed age. Without a clean value the year is listed as missing.
  miles_per_year: 12000    # mileage unknown: age x this (never treated as 0 miles)
  region: NY               # state unknown: this state's total-loss threshold
  # State from the ZIP code when the description gives a ZIP but no state (3-digit prefix
  # ranges, USPS; only the states the total-loss table knows).
  zip_prefix_state:
    NY: [[100, 149]]
    CA: [[900, 961]]
    TX: [[750, 799], [885, 885]]
    FL: [[320, 349]]
    MI: [[480, 499]]
    OH: [[430, 459]]

repair_cost:
  status: PLACEHOLDER
  replace_with: Shop estimate data (CCC/Mitchell-style) or dealer repair invoices by panel and damage type.
  # A seller's own shop quote (values.repair_estimate) becomes the repair band: quote x these.
  seller_quote_spread: [0.9, 1.0, 1.3]
  # Cost at severity 1.0 for a dent; scaled by damage type multiplier and by severity.
  panel_base_cents:
    front_bumper: [60000, 90000, 140000]
    rear_bumper: [55000, 85000, 130000]
    hood: [70000, 110000, 170000]
    fender: [60000, 95000, 150000]
    door: [80000, 120000, 190000]
    quarter_panel: [120000, 180000, 280000]
    roof: [150000, 230000, 360000]
    windshield: [30000, 45000, 70000]
    frame: [400000, 700000, 1100000]
  damage_type_multiplier:
    scratch: 0.4
    dent: 1.0
    crack: 1.2
    crush: 2.0
    broken: 2.5
  min_severity_factor: 0.15   # severity 0 still costs this fraction of the full-severity cost

market:
  status: PLACEHOLDER
  replace_with: Observed as-is vs repaired vs salvage sale prices from ACV and Copart results.
  # Untuned: these were once adjusted to make the $600 dent case favor repair; that was reverted.
  # See `python -m underscope.sensitivity` for how decisions move with them.
  as_is_discount_multiple_of_repair: 1.3   # buyers deduct this multiple of expected repair cost
  as_is_floor_fraction: 0.10
  # A dealer buying a wreck on ACV only to resell it at salvage keeps this % of the salvage
  # price as margin (on top of Copart's fee and transport). Real data: ACV bids on cars later
  # relisted at Copart. The routing check uses the same margin the other way round (buy on
  # Copart, relist as-is on ACV) to flag an ACV as-is price the comps can't support.
  as_is_dealer_flip_margin_pct: 10
  # Accident-history haircut on clean value, scaled by damage score (expected repair cost /
  # clean value, capped at 1): a cosmetic fix carries little stigma, heavy damage the full %.
  # Anchored just under the rebuilt-title discount (title.factor.rebuilt); not tuned to any case.
  repaired_value_haircut_pct_at_total_damage: 20
  salvage_fraction_of_clean: [0.10, 0.22, 0.34]   # before damage adjustment
  salvage_damage_adjust_pct_per_unit_severity: 20 # extra % off salvage value per unit of damage score (cap 1)

fees:
  status: PLACEHOLDER
  replace_with: Published seller fee schedules from ACV and Copart under a data partnership.
  acv:
    flat_cents: 25000
    pct_of_price: 2.0
  copart:
    flat_cents: 15000
    pct_of_price: 8.0
    # Paid by the buyer, so it only enters the cross-lane check (a dealer buying on Copart to
    # relist on ACV). Third-party guides put Copart's total buyer fees near 11-13% of a $10k
    # lot; replace with Copart's published buyer fee schedule.
    buyer_flat_cents: 15000
    buyer_pct_of_price: 10.0

transport:
  status: PLACEHOLDER
  replace_with: Carrier quotes by lane and vehicle class.
  acv_cents: [20000, 40000, 70000]
  copart_cents: [15000, 30000, 55000]
  parts_cents: [10000, 20000, 35000]   # tow to dismantling bay

timing:
  status: PLACEHOLDER
  replace_with: Observed days-on-lot and repair turnaround by path.
  holding_cost_per_day_cents: 4000
  repair_days: [3, 7, 20]
  days_to_sell:
    repair_then_acv: [7, 14, 30]
    acv_as_is: [5, 10, 21]
    copart_salvage: [10, 21, 40]
    part_out: [30, 60, 120]

title:
  status: PLACEHOLDER
  replace_with: Observed price discount of branded vs clean titles in auction results.
  # Multiplier on value, keyed by title status, as [low, expected, high]. Uncertain like any
  # market input; ranges are symmetric so the expected value is the middle number.
  factor:
    clean: [1.0, 1.0, 1.0]
    rebuilt: [0.66, 0.78, 0.90]
    salvage: [0.48, 0.60, 0.72]
  # A repaired vehicle whose repair cost crosses the total-loss threshold gets this brand.
  brand_after_total_loss_repair: rebuilt

total_loss:
  status: PLACEHOLDER
  replace_with: State statutory total-loss thresholds (percent of ACV) and insurer practice.
  default_threshold_pct: 75
  threshold_pct_by_region:
    NY: 75
    CA: 100
    TX: 100
    FL: 80
    MI: 75
    OH: 70

parts:
  status: PLACEHOLDER
  replace_with: Dismantler recovery data (parts catalog value, sell-through and days by part category).
  gross_value_fraction_of_clean: [0.70, 0.95, 1.30]
  sell_through: [0.35, 0.50, 0.65]
  teardown_labor_cents: [80000, 120000, 180000]
  storage_cents_per_day: 1500
  engine_audio_abnormal_value_penalty_pct: 12   # engine parts worth less if audio flags a problem
  # Share of whole-vehicle parts value that sits in each panel's area (damaged parts don't sell).
  panel_share_of_parts_value:
    front_bumper: 0.04
    rear_bumper: 0.03
    hood: 0.03
    fender: 0.03
    door: 0.04
    quarter_panel: 0.03
    roof: 0.02
    windshield: 0.02
    frame: 0.15
  # Fraction of a panel's parts value destroyed at severity 1.0, by damage type.
  damage_type_loss_factor:
    scratch: 0.1
    dent: 0.3
    crack: 0.6
    crush: 1.0
    broken: 1.0

hidden_damage:
  status: PLACEHOLDER
  replace_with: Post-repair surprise-cost history from partner shops or inspection-to-repair comparisons.
  reserve_pct_of_repair: 15
  undercarriage_extra_cents: 150000
  engine_audio_extra_cents: 200000
  unknown_flag_extra_cents: 30000   # flag absent: allowance for unseen damage

condition:
  status: PLACEHOLDER
  replace_with: Sale-price differences and repair invoices by run status, keys, engine and transmission condition, flood or fire history, odometer brand and title paperwork, from ACV and Copart results.
  # What the seller's description says beyond the body damage (the reader's Assessment).
  # effects: fact -> stated value -> what it does. Values not listed (runs_and_drives, ok,
  # present, actual...) do nothing.
  #   repair_cents   added to the repair cost [low, expected, high]; the as-is price follows it
  #                  through market.as_is_discount_multiple_of_repair
  #   acv_as_is, repaired   multiplier on that ACV sale price [low, expected, high]
  #   copart         multiplier on the Copart price, only when no comps were given (comps are
  #                  taken to match the car)
  #   tow_cents      extra transport for the ACV as-is sale
  #   days           extra holding days before any exit can sell
  # unknown: a fact the description does not state is not guessed. In chance_pct % of the
  # simulated outcomes it takes the bad `value` and its effects; in the rest it does nothing.
  effects:
    run_status:
      starts:
        acv_as_is: [0.85, 0.92, 0.97]
        copart: [0.90, 0.95, 1.0]
        tow_cents: [0, 7500, 15000]
      does_not_start:
        repair_cents: [20000, 120000, 400000]   # find and fix a no-start; skipped when the engine or transmission is stated failed
        acv_as_is: [0.60, 0.72, 0.85]
        copart: [0.75, 0.85, 0.95]
        tow_cents: [10000, 20000, 35000]
    keys:
      "no":
        repair_cents: [15000, 35000, 80000]
    engine:
      minor:
        repair_cents: [20000, 60000, 150000]
      failed:
        repair_cents: [250000, 450000, 800000]
    transmission:
      minor:
        repair_cents: [20000, 60000, 150000]
      failed:
        repair_cents: [200000, 350000, 600000]
    catalytic_converter:
      missing:
        repair_cents: [80000, 180000, 350000]
    airbags_deployed:
      "yes":
        repair_cents: [100000, 250000, 450000]   # skipped when the caller's repair estimate is used (it has the airbags)
    flood_suspected:
      "yes":
        acv_as_is: [0.55, 0.70, 0.85]
        repaired: [0.60, 0.72, 0.85]
        copart: [0.80, 0.90, 1.0]
    fire_damage:
      "yes":
        acv_as_is: [0.60, 0.75, 0.88]
        repaired: [0.65, 0.78, 0.90]
        copart: [0.80, 0.90, 1.0]
    odometer_status:
      not_actual:
        acv_as_is: [0.75, 0.85, 0.92]
        repaired: [0.75, 0.85, 0.92]
      exempt:
        acv_as_is: [0.92, 0.96, 1.0]
        repaired: [0.92, 0.96, 1.0]
    parts_missing:
      "yes":
        acv_as_is: [0.85, 0.92, 0.98]
        copart: [0.85, 0.92, 0.98]
    title_in_hand:
      "no":
        days: 21   # RULES.md T09
    lien:
      open:
        days: 10   # RULES.md T10
  unknown:
    run_status: {value: does_not_start, chance_pct: 20}
    keys: {value: "no", chance_pct: 5}
    engine: {value: failed, chance_pct: 8}
    transmission: {value: failed, chance_pct: 6}
    catalytic_converter: {value: missing, chance_pct: 3}
    airbags_deployed: {value: "yes", chance_pct: 10}
    flood_suspected: {value: "yes", chance_pct: 3}
    fire_damage: {value: "yes", chance_pct: 1}
    odometer_status: {value: not_actual, chance_pct: 2}
    title_in_hand: {value: "no", chance_pct: 10}
    lien: {value: open, chance_pct: 8}
    parts_missing: {value: "yes", chance_pct: 5}

grades:
  status: PLACEHOLDER
  replace_with: Inspection reports that pair a part's grade with its repair invoice (share of a full panel repair per grade), and how often a described or photographed damage is confirmed.
  # How the app's part grades become damage findings (bridge.to_engine). severity is the share
  # of a full panel repair; confidence is how sure the source is that the damage exists.
  repairable: {damage_type: dent, severity: 0.35}
  replace: {damage_type: broken, severity: 0.9}
  confidence: 0.85
  frame_suspected: {damage_type: crush, severity: 0.6, confidence: 0.6}
  # Parts that are not body panels: a repair cost [low, high] per grade, added to the engine's
  # own estimate (not used when the page's estimate or a seller's quote is the repair cost).
  other_parts_cents:
    left_mirror: {repairable: [5000, 15000], replace: [15000, 45000]}
    right_mirror: {repairable: [5000, 15000], replace: [15000, 45000]}
    wheels_and_tires: {repairable: [10000, 40000], replace: [40000, 160000]}
    interior: {repairable: [15000, 80000], replace: [100000, 400000]}
    engine_bay: {repairable: [20000, 120000], replace: [100000, 500000]}

damage_areas:
  status: PLACEHOLDER
  replace_with: Copart lot data pairing the listed primary and secondary damage with the parts actually damaged, by vehicle class.
  # primary_damage / secondary_damage are Copart's listing categories. When the description
  # names an area but does not grade a part, the area fills that part with the grade below
  # (the secondary area one step milder: replace -> repairable). Parts the description grades
  # are never overridden. `flags` are set only where the description leaves them unknown.
  # "none" means no damage: every ungraded part is fine.
  fill_ungraded_parts: true   # false: damage areas are a model feature only
  parts:
    front: {front_bumper: replace, hood: repairable, grille: replace, left_headlight: repairable, right_headlight: repairable}
    rear: {rear_bumper: replace, tailgate_or_rear_doors: repairable, left_taillight: repairable, right_taillight: repairable}
    side: {left_front_door: repairable, left_rear_door: repairable, left_front_fender: repairable, left_rear_quarter: repairable}
    rollover: {roof: replace, windshield: replace, hood: repairable, left_front_door: repairable, right_front_door: repairable}
    all_over: {front_bumper: repairable, rear_bumper: repairable, hood: repairable, roof: repairable, left_front_door: repairable, right_front_door: repairable, left_front_fender: repairable, right_front_fender: repairable}
    undercarriage: {underbody: repairable}
    mechanical: {engine_bay: repairable}
    hail: {hood: repairable, roof: repairable, tailgate_or_rear_doors: repairable}
    water: {interior: replace}
    fire: {engine_bay: replace, interior: repairable}
    vandalism: {windshield: replace, interior: repairable}
    theft: {interior: repairable}
    minor: {front_bumper: repairable}
    none: {}
  flags:
    rollover: [frame_suspected]
    water: [flood_suspected]
    fire: [fire_damage]

signals:
  status: PLACEHOLDER
  replace_with: Repair invoices and arbitration claims by warning light, fault-code system and reported symptom; title-transfer times by state pair.
  # Complaints in the seller's words. Each is a chance of a repair: in chance_pct % of the
  # simulated outcomes it costs repair_cents [low, expected, high]. A light, code or symptom on
  # the engine or transmission is skipped when that component's condition is already stated
  # (its cost is counted there).
  warning_light:
    check_engine: {chance_pct: 60, repair_cents: [10000, 60000, 250000]}
    abs: {chance_pct: 70, repair_cents: [10000, 40000, 150000]}
    airbag: {chance_pct: 70, repair_cents: [15000, 60000, 200000]}
    other: {chance_pct: 40, repair_cents: [5000, 25000, 100000]}
  # Fault codes by first letter: P powertrain, C chassis, B body, U network.
  code:
    P: {repair_cents: [10000, 70000, 300000]}
    C: {repair_cents: [10000, 40000, 150000]}
    B: {repair_cents: [5000, 30000, 120000]}
    U: {repair_cents: [5000, 35000, 150000]}
  code_status_chance_pct: {confirmed: 90, pending: 50, history: 15}
  max_codes: 4   # codes beyond this add nothing (one fault often sets several)
  symptom:
    engine: {chance_pct: 70, repair_cents: [20000, 90000, 400000]}
    transmission: {chance_pct: 70, repair_cents: [20000, 90000, 350000]}
    brakes: {chance_pct: 80, repair_cents: [10000, 35000, 120000]}
    steering_suspension: {chance_pct: 80, repair_cents: [15000, 50000, 180000]}
    electrical: {chance_pct: 70, repair_cents: [5000, 30000, 150000]}
    body: {chance_pct: 80, repair_cents: [5000, 30000, 120000]}
    interior: {chance_pct: 80, repair_cents: [5000, 25000, 100000]}
    other: {chance_pct: 50, repair_cents: [5000, 20000, 80000]}
  out_of_state_title_days: 7     # title issued by another state than the one the vehicle is in
  # All-wheel and four-wheel drive: a transmission repair costs this much more (transfer case).
  drivetrain_transmission_cost_factor: {awd: 1.15, "4wd": 1.15}
  # Flood signs on a battery vehicle: the flood price factors are multiplied by this.
  fuel_flood_price_factor: {electric: 0.85, hybrid: 0.92}

router_training:
  status: PLACEHOLDER
  replace_with: Recorded outcomes (the same car's net on ACV and on Copart). With them these made-up cars are not needed (underscope train-router --data).
  # The MADE-UP cars the router model is trained on while there are no recorded outcomes
  # (router.generate). Shares are not market shares. Each car is built in full and labelled by
  # the simulation on everything known about it; then facts are hidden from what the model
  # sees, the way the reader's output hides them (router.mask).
  # profiles: how complete the description is. sparse and medium hide each fact at the rate
  # the reader's own output gives it (config/reader_given_rates.json, rebuilt with
  # `underscope reader-rates`); needed gives every needed fact and hides helpful ones at the
  # medium rate; full hides nothing.
  profiles: {sparse: 0.45, medium: 0.25, needed: 0.15, full: 0.15}
  clean_value_dollars: [3000, 45000]        # log-uniform
  mileage: [5000, 220000]
  year: [2008, 2025]
  title_share: {clean: 0.80, rebuilt: 0.12, lemon: 0.08}   # titles that allow both marketplaces
  seller_share: {dealer: 0.6, fleet: 0.2, lender: 0.2}   # never a private seller or an insurer: a rule decides those
  out_of_state_title_share: 0.1
  drivetrain_share: {fwd: 0.5, rwd: 0.15, awd: 0.25, "4wd": 0.1}
  fuel_share: {gas: 0.82, diesel: 0.05, hybrid: 0.08, electric: 0.05}
  damaged_parts_geometric_p: 0.22           # number of damaged parts ~ geometric - 1
  replace_share: 0.4                        # of damaged parts
  comps_count: [3, 7]
  comps_ratio: {base: 0.72, per_damaged_part: 0.045, sd: 0.14, spread_sigma: 0.2}   # comps / clean value
  reserve_ratio: [0.15, 0.6]                # seller's lowest price / clean value
  app_repair_estimate_share: 0.5            # bodies that carry the page's repair estimate
  seller_quote_share: 0.5                   # damaged cars that also have a seller's repair quote
  part_cost_dollars: {repairable: [150, 700], replace: [450, 2600]}
  storage_cost: {share: 0.1, dollars_per_day: [5, 40]}
  sell_by: {share: 0.1, days: [7, 60]}
  already_repaired: {"yes": 0.05, partly: 0.05, "no": 0.9}
  complaints: {warning_light_share: 0.25, code_share: 0.15, symptom_share: 0.35}
  # How often each value. The bad value of a fact (does_not_start, failed, missing...) is NOT
  # set here: it is drawn at the chance `condition.unknown` gives it, so a fact hidden from the
  # model is bad as often as the simulation assumes for an unstated fact. These shares split
  # what is left among the other values.
  stated:
    run_status: {runs_and_drives: 0.5, starts: 0.2, does_not_start: 0.3}
    keys: {"yes": 0.8, "no": 0.2}
    engine_condition: {ok: 0.6, minor: 0.2, failed: 0.2}
    transmission_condition: {ok: 0.65, minor: 0.2, failed: 0.15}
    catalytic_converter: {present: 0.85, missing: 0.15}
    odometer_status: {actual: 0.8, not_actual: 0.1, exempt: 0.1}
    title_in_hand: {"yes": 0.75, "no": 0.25}
    lien: {none: 0.75, open: 0.25}
    parts_missing: {"yes": 0.15, "no": 0.85}
  # Flags with no entry in `condition.unknown` (the others use that chance).
  flag_true:
    frame_suspected: 0.05
    fluid_leak: 0.10
  model: {max_iter: 400, learning_rate: 0.08, threads: 4, held_out_share: 0.2}

lanes:
  status: PLACEHOLDER
  replace_with: ACV and Copart listing policy by title brand. ACV's branded-title rule is unconfirmed (RULES.md T02 says verify).
  # Exits each title may use, keyed by the title names the web app sends. Decided 2026-11-10:
  # salvage, flood and non-repairable go to Copart only until ACV confirms its policy. RULES.md
  # T02 excludes only ACV's as-is sale for salvage; add repair_then_acv to salvage to follow it.
  by_title:
    clean: [repair_then_acv, acv_as_is, copart_salvage]
    rebuilt: [repair_then_acv, acv_as_is, copart_salvage]
    lemon: [repair_then_acv, acv_as_is, copart_salvage]
    salvage: [copart_salvage]
    flood: [copart_salvage]
    non_repairable: [copart_salvage]
  why_excluded:
    salvage: "Salvage title: ACV is excluded until ACV confirms its branded-title policy."
    flood: "Flood title: ACV is excluded until ACV confirms its branded-title policy."
    non_repairable: "Non-repairable title: it can't be repaired and resold, so only salvage buyers can take it."
  # Part-out is a dismantler's own exit (teardown, months of parts sales). Most sellers don't
  # dismantle, and dismantlers already bid on Copart, so their demand is in Copart's price.
  seller_can_part_out: false
  # Exits a stated fact rules out. Flood signs stated by the seller (or water named as the
  # damage) exclude ACV: flood history is a mandatory announcement at dealer auctions and such
  # vehicles are sold at salvage auction. Added 2026-11-17. UNCONFIRMED policy.
  fact_excludes:
    flood_suspected: [repair_then_acv, acv_as_is]
  why_fact_excluded:
    flood_suspected: "Flood signs stated: ACV is excluded, flood vehicles sell at salvage auction (policy not confirmed with ACV)."
  # Exits a kind of seller cannot use. ACV is a dealer-to-dealer marketplace, so a private
  # owner cannot list there, and neither can an insurer: insurers sell their claim vehicles at
  # salvage auction (about 80% of Copart's vehicles in fiscal 2024-2026 came from insurers,
  # Copart 10-K FY2026). Added 2026-11-16 after a check on published Copart lots: the engine sent
  # 88% of insurers' unbranded-title lots to ACV. UNCONFIRMED policy, like the branded-title rule.
  seller_excludes:
    individual: [repair_then_acv, acv_as_is]
    insurer: [repair_then_acv, acv_as_is]
  why_seller_excluded:
    individual: "Private seller: ACV is a dealer-to-dealer marketplace (policy not confirmed with ACV)."
    insurer: "Insurer: insurers sell claim vehicles at salvage auction, not dealer to dealer (policy not confirmed with ACV)."

routing:
  status: PLACEHOLDER
  replace_with: Thresholds checked by calibration on real outcomes (when it says 70%, ACV is right about 70% of the time).
  # P(ACV beats Copart) at or above clear_above is a clear ACV answer, at or below clear_below a
  # clear Copart answer, in between a close call (RULES.md D01).
  clear_above: 0.70
  clear_below: 0.30
  reserve_warn_below: 0.50   # chosen exit meets the seller's lowest price in fewer outcomes than this: input check
  model_acv_at: 0.50   # the router model sends the car to ACV at or above this p_acv
  min_comps: 3   # fewer comparable salvage sales than this (or no clean value): not enough data

simulation:
  status: PLACEHOLDER
  replace_with: Calibrated uncertainty from backtests on real outcomes.
  draws: 1000
  seed: 20260101
  value_noise_sigma: 0.08      # lognormal sigma on market values
  review_overlap_threshold: 0.35   # P(some other path beats winner in a paired draw) at/above this -> human review
  low_confidence_threshold: 0.60   # mean finding confidence below this -> human review
  total_loss_min_branded_share: 0.05   # threshold only "decides" if at least this share of draws cross it
