name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-and-reader:
    name: Page APIs and reader (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check (api, scripts)
        run: pnpm run typecheck
      - name: Type check (reader)
        run: pnpm run typecheck:reader
      - name: Reader tests
        run: pnpm run test:reader
      - name: Sample vehicles read and priced as expected
        run: pnpm run test:samples

  engine:
    name: Routing engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Published schemas match the code
        run: underscope contracts --check
      - name: Tests
        run: pytest -q
